notes: |
  Cabot Oil & Gas merged with Cimarex Energy in 2021 to form Coterra Energy. Neither the legacy
  entity nor Coterra publishes a public, general-purpose developer API or developer pricing.
  Investor-relations data and regulatory filings are available through SEC and IR portals rather
  than a metered developer API.
